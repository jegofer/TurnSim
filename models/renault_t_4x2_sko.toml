# Configuración 1: Renault Trucks T 480 (4x2, batalla 3.800 m) + Schmitz Cargobull S.KO Cool (3 ejes, 13.62 m)
[vehicle]
wheelbase      = 3.800   # Batalla de la cabeza tractora (Renault Trucks T 4x2 "38")
front_overhang = 1.365   # Voladizo delantero (ficha oficial Renault Trucks T)
rear_overhang  = 0.825   # Voladizo trasero del bastidor
width          = 2.550   # Anchura de la tractora sin retrovisores
hitch_offset   = 0.550   # Quinta rueda 0.550 m por delante del eje motriz

[vehicle.trailer]
wheelbase      = 7.700   # Kingpin al centro del trídem (Schmitz Cargobull S.KO Cool)
front_overhang = 1.685   # Voladizo delantero con equipo de frío S.CU
rear_overhang  = 4.200   # Voladizo trasero tras el centro del trídem (kingpin a trasera = 11.90 m)
width          = 2.600   # Anchura reglamentaria ATP / frigorífico (RD 2822/1998)

[[path]]
type   = "straight"
length = 15.0

[[path]]
type   = "arc"
radius = 12.5
angle  = 90.0

[[path]]
type   = "straight"
length = 15.0

[render]
ghost_interval = 2.5
px_per_m       = 50.0
straight_step  = 0.05
arc_step       = 0.5
show_ghosts    = true
show_axles     = true
show_reference_point = true
show_axle_traces = true
show_scale     = true
